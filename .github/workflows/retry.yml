name: Retry failed update

# A run cannot rerun itself while it is still in progress, so the retry must
# come from outside: this fires after the update workflow completes, waits out
# the (usually transient) USGS outage, and reruns only the failed jobs.
# Reruns re-trigger this workflow with a higher run_attempt, so the guard
# allows at most two automatic retries.

on:
  workflow_run:
    workflows: ["Update GA groundwater data and deploy"]
    types: [completed]

permissions:
  actions: write

jobs:
  retry:
    if: github.event.workflow_run.conclusion == 'failure' && github.event.workflow_run.run_attempt < 3
    runs-on: ubuntu-latest
    steps:
      - name: Wait out the outage and rerun the failed jobs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sleep 900
          gh run rerun ${{ github.event.workflow_run.id }} --failed --repo ${{ github.repository }}
